<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run replay</title>
<style>
:root {
  --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1d1b; --quiet: #6b6a66; --line: #e3e1dc; --accent: #2f6fdb;
  --death: #d6453d; --ach: #c8941a; --level: #2e9a52; --quest: #2f6fdb; --chat: #8a8883; --hp: #3fa34d; --mana: #3d7fd9;
  --rage: #c8453d; --energy: #d9b23d;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151514; --panel: #1f1f1d; --ink: #ecebe7; --quiet: #9b9a95; --line: #33322f; --accent: #6b9cf0;
} }
:root[data-theme="dark"] { --bg: #151514; --panel: #1f1f1d; --ink: #ecebe7; --quiet: #9b9a95; --line: #33322f; --accent: #6b9cf0; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; }
body { display: grid; grid-template-rows: auto 1fr auto; height: 100vh; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
header h1 { font-size: 15px; margin: 0; font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: flex; align-items: center; gap: 6px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; background: transparent; color: var(--ink); font: inherit; }
.chip[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid #0006; }
main { display: grid; grid-template-columns: 1fr 360px; min-height: 0; }
#mapwrap { position: relative; overflow: hidden; background: #2a2a28; cursor: grab; }
#mapwrap:active { cursor: grabbing; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; }
.hint { position: absolute; left: 10px; bottom: 8px; color: #fffc; font-size: 11.5px; text-shadow: 0 1px 2px #000; pointer-events: none; }
aside { display: grid; grid-template-rows: auto 1fr; min-height: 0; border-left: 1px solid var(--line); background: var(--panel); }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; padding: 9px 4px; border: 0; background: none; color: var(--quiet); font: inherit; cursor: pointer; border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.pane { overflow-y: auto; padding: 8px 12px; min-height: 0; }
.row { display: grid; grid-template-columns: 44px 1fr; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.row:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
.row .t { color: var(--quiet); font-variant-numeric: tabular-nums; }
.who { font-weight: 600; }
.muted { color: var(--quiet); }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
.card h3 { margin: 0 0 4px; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 3px 0; }
.bar > div { height: 100%; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--quiet); font-size: 12px; }
.board { width: 100%; border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
.board td { padding: 3px 4px; border-bottom: 1px solid var(--line); }
.board td.num { text-align: right; }
#chart { width: 100%; height: 220px; display: block; }
#live[aria-pressed="true"] { color: var(--death); border-color: var(--death); }
footer { display: grid; grid-template-columns: auto auto auto auto 1fr; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--line); background: var(--panel); }
footer button, footer select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
#clock { font-variant-numeric: tabular-nums; min-width: 110px; }
.tlwrap { grid-column: -2; }
#timeline { width: 100%; height: 38px; cursor: pointer; display: block; }
.legend { display: flex; gap: 10px; color: var(--quiet); font-size: 11.5px; }
.legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; background: var(--c); }
@media (max-width: 760px) {
  main { grid-template-columns: 1fr; grid-template-rows: 55vh 1fr; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
  footer { grid-template-columns: auto auto 1fr; }
  #clock { grid-column: 3; }
  .tlwrap { grid-column: 1 / -1; }
}
</style>
</head>
<body>
<header>
  <h1 id="title">__TITLE__</h1>
  <div class="chips" id="chips"></div>
  <div class="legend"><span style="--c:var(--death)">death</span><span style="--c:var(--ach)">achievement</span><span style="--c:var(--level)">level</span><span style="--c:var(--quest)">quest</span><span style="--c:var(--chat)">chat</span></div>
</header>
<main>
  <div id="mapwrap"><canvas id="map"></canvas><div class="hint">drag to pan · scroll to zoom · click a player chip to follow</div></div>
  <aside>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="players" aria-selected="true">Players</button>
      <button role="tab" data-tab="events">Events</button>
      <button role="tab" data-tab="chat">Chat</button>
      <button role="tab" data-tab="combat">Combat</button>
      <button role="tab" data-tab="agent">Agent</button>
      <button role="tab" data-tab="scores">Scores</button>
    </div>
    <div class="pane" id="pane"></div>
  </aside>
</main>
<footer>
  <button id="play" aria-label="Play">▶</button>
  <button id="live" hidden aria-pressed="true" title="Follow the newest data">● Live</button>
  <select id="speed" aria-label="Speed"><option value="1">1×</option><option value="10">10×</option><option value="30" selected>30×</option><option value="60">60×</option><option value="300">300×</option></select>
  <div id="clock">0:00 / 0:00</div>
  <div class="tlwrap"><canvas id="timeline"></canvas></div>
</footer>
<script type="application/json" id="data">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const LIVE = !!D.live; // live.ts: data streams in over /stream and the map comes as /tile/<map>/<gx>/<gy>.png
const img = new Image(); if (!LIVE) img.src = "__MAP__";
const $ = (id) => document.getElementById(id);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmt = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const P = D.players, color = Object.fromEntries(P.map((p) => [p.name, p.color]));
// a distinct colour per player (two agents of one class must not look alike); class is in the label
const PALETTE = ["#e6194b", "#3cb44b", "#ffe119", "#4363d8", "#f58231", "#911eb4", "#46f0f0", "#f032e6", "#bcf60c", "#fabebe", "#008080", "#9a6324"];
P.forEach((p, i) => { p.color = PALETTE[i % PALETTE.length]; color[p.name] = p.color; });
// judge samples arrive as "score" events: {value (progress), rate, recent_rate, pace, score}
const SCORES = {}; // name -> score events in time order
const addScore = (e) => (SCORES[e.n] ??= []).push(e);
D.events.filter((e) => e.ev === "score").forEach(addScore);
const scores = (n) => SCORES[n] ?? [];
const scoreAt = (n, t) => { const a = scores(n); let lo = 0, hi = a.length; while (lo < hi) { const m = (lo + hi) >> 1; if (a[m].t <= t) lo = m + 1; else hi = m; } return a[lo - 1] ?? null; };
let metric = "score";
const METRICS = { score: "score", value: "progress", pace: "pace", recent_rate: "rate /h (10 min)" };
const CLASSES = ["", "Warrior", "Paladin", "Hunter", "Rogue", "Priest", "Death Knight", "Shaman", "Mage", "Warlock", "", "Druid"];
const CHAT = { 1: "say", 2: "party", 3: "raid", 4: "guild", 6: "yell", 7: "whisper", 10: "emote", 17: "channel" };
const POWER = { 0: ["mana", "--mana"], 1: ["rage", "--rage"], 3: ["energy", "--energy"], 6: ["runic", "--rage"] };
let t = 0, playing = false, speed = 30, follow = null, tab = "players";

// ---------- interpolation ----------
const idx = (track, t) => { let lo = 0, hi = track.length - 1; if (hi < 0 || t < track[0][0]) return -1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (track[m][0] <= t) lo = m; else hi = m - 1; } return lo; };
function at(p, t) {
  const i = idx(p.track, t); if (i < 0) return null;
  const a = p.track[i], b = p.track[i + 1];
  if (!b || b[0] - a[0] > 5000) return { r: a, x: a[1], y: a[2] }; // gap (logged out / teleport): hold
  const f = (t - a[0]) / (b[0] - a[0]);
  return { r: a, x: a[1] + (b[1] - a[1]) * f, y: a[2] + (b[2] - a[2]) * f };
}

// ---------- map view ----------
// World (x north, y west) -> map pixels at M.res yards/px, origin at (M.xMax, M.yMax). A static replay has one
// image covering that box; live mode draws 533-yard grid tiles around whatever is on screen.
const cv = $("map"), cx = cv.getContext("2d"), M = D.map;
const toPx = (x, y) => [(M.yMax - y) / M.res, (M.xMax - x) / M.res];
let view = { s: 1, ox: 0, oy: 0 };
function sizeCanvas() { const r = cv.getBoundingClientRect(); cv.width = r.width * devicePixelRatio; cv.height = r.height * devicePixelRatio; return r; }
function fitBox(xMin, xMax, yMin, yMax) {
  const r = sizeCanvas(), [x0, y0] = toPx(xMax, yMax), [x1, y1] = toPx(xMin, yMin);
  view.s = Math.min(r.width / Math.max(1, x1 - x0), r.height / Math.max(1, y1 - y0));
  view.ox = (r.width - (x1 + x0) * view.s) / 2; view.oy = (r.height - (y1 + y0) * view.s) / 2;
}
function fit() {
  if (!LIVE) return fitBox(M.xMax - M.h * M.res, M.xMax, M.yMax - M.w * M.res, M.yMax);
  const pts = P.flatMap((p) => p.track.filter((r) => r[15] === M.id).slice(-60));
  if (!pts.length) return sizeCanvas();
  const xs = pts.map((r) => r[1]), ys = pts.map((r) => r[2]);
  fitBox(Math.min(...xs) - 300, Math.max(...xs) + 300, Math.min(...ys) - 300, Math.max(...ys) + 300);
}
const GRID = 1600 / 3, tiles = new Map();
function drawTiles(w, h) {
  // grid squares under the screen: gx = floor(32 - x / GRID), likewise gy
  const wx = (sx, sy) => [M.xMax - ((sy - view.oy) / view.s) * M.res, M.yMax - ((sx - view.ox) / view.s) * M.res];
  const [xa, ya] = wx(0, 0), [xb, yb] = wx(w, h);
  const g = (v) => Math.floor(32 - v / GRID);
  for (let gx = g(xa); gx <= g(xb); gx++) for (let gy = g(ya); gy <= g(yb); gy++) {
    if (gx < 0 || gy < 0 || gx > 63 || gy > 63) continue;
    const key = `${M.id}/${gx}/${gy}`;
    if (!tiles.has(key)) { const im = new Image(); im.onload = () => drawMap(); im.src = `tile/${key}.png`; tiles.set(key, im); }
    const im = tiles.get(key); if (!im.complete || !im.naturalWidth) continue;
    const [sx, sy] = scr(GRID * (32 - gx), GRID * (32 - gy)), size = (GRID / M.res) * view.s;
    cx.drawImage(im, sx, sy, size + 0.5, size + 0.5);
  }
}
const scr = (x, y) => { const [px, py] = toPx(x, y); return [view.ox + px * view.s, view.oy + py * view.s]; };
function drawMap() {
  const r = cv.getBoundingClientRect();
  if (follow) { const pp = at(P.find((p) => p.name === follow), t); if (pp) { const [px, py] = toPx(pp.x, pp.y); view.ox = r.width / 2 - px * view.s; view.oy = r.height / 2 - py * view.s; } }
  cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  cx.clearRect(0, 0, r.width, r.height);
  cx.imageSmoothingEnabled = view.s < 2;
  if (LIVE) drawTiles(r.width, r.height); else cx.drawImage(img, view.ox, view.oy, M.w * view.s, M.h * view.s);
  // labels
  cx.textAlign = "center";
  for (const l of D.labels) {
    if (!l.zone && view.s < 0.9) continue;
    const [sx, sy] = scr(l.x, l.y);
    cx.font = l.zone ? "600 15px system-ui" : "12px system-ui";
    cx.lineWidth = 3; cx.strokeStyle = "#000a"; cx.fillStyle = l.zone ? "#fff" : "#fffd";
    cx.strokeText(l.name, sx, sy); cx.fillText(l.name, sx, sy);
  }
  // routes: travelled solid, ahead faint
  for (const p of P) {
    if (!p.track.length) continue;
    const i = idx(p.track, t);
    for (const [from, to, alpha] of [[Math.max(0, i), p.track.length - 1, 0.18], [0, Math.max(0, i), 0.95]]) {
      cx.beginPath(); let pen = false, last = null;
      for (let k = from; k <= to; k++) {
        const q = p.track[k]; if (q[15] !== M.id) { pen = false; continue; }
        const [sx, sy] = scr(q[1], q[2]);
        if (!pen || (last && q[0] - last > 5000)) cx.moveTo(sx, sy); else cx.lineTo(sx, sy);
        pen = true; last = q[0];
      }
      if (alpha > 0.5) { const pp = at(p, t); if (pp) cx.lineTo(...scr(pp.x, pp.y)); }
      cx.globalAlpha = alpha; cx.lineWidth = 2.5; cx.strokeStyle = "#000"; cx.stroke();
      cx.lineWidth = 1.6; cx.strokeStyle = p.color; cx.stroke(); cx.globalAlpha = 1;
    }
  }
  // event markers up to now
  for (const e of D.events) {
    if (e.t > t || !["death", "achievement", "level", "quest"].includes(e.ev)) continue;
    const p = P.find((q) => q.name === e.n); const pp = p && at(p, e.t); if (!pp || pp.r[15] !== M.id) continue;
    const [sx, sy] = scr(pp.x, pp.y);
    cx.fillStyle = css({ death: "--death", achievement: "--ach", level: "--level", quest: "--quest" }[e.ev]);
    cx.strokeStyle = "#000"; cx.lineWidth = 1;
    cx.font = "bold 13px system-ui"; cx.textAlign = "center";
    const glyph = { death: "✕", achievement: "★", level: "▲", quest: "!" }[e.ev];
    cx.strokeText(glyph, sx, sy + 4); cx.fillText(glyph, sx, sy + 4);
  }
  // players now
  for (const p of P) {
    const pp = at(p, t); if (!pp || pp.r[15] !== M.id) continue;
    const [sx, sy] = scr(pp.x, pp.y), dead = !pp.r[11], ghost = pp.r[12];
    cx.beginPath(); cx.arc(sx, sy, 6, 0, 7);
    cx.fillStyle = ghost ? "#fff4" : p.color; cx.fill();
    cx.lineWidth = follow === p.name ? 3 : 1.5; cx.strokeStyle = pp.r[13] ? css("--death") : "#000"; cx.stroke();
    if (dead && !ghost) { cx.strokeStyle = css("--death"); cx.lineWidth = 2; cx.beginPath(); cx.moveTo(sx - 5, sy - 5); cx.lineTo(sx + 5, sy + 5); cx.moveTo(sx + 5, sy - 5); cx.lineTo(sx - 5, sy + 5); cx.stroke(); }
    cx.font = "600 12px system-ui"; cx.textAlign = "left"; cx.lineWidth = 3; cx.strokeStyle = "#000b"; cx.fillStyle = "#fff";
    const label = p.name + (ghost ? " (ghost)" : "");
    cx.strokeText(label, sx + 9, sy - 7); cx.fillText(label, sx + 9, sy - 7);
  }
}
let drag = null;
cv.addEventListener("pointerdown", (e) => { drag = [e.clientX, e.clientY]; follow = null; renderChips(); cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", (e) => { if (!drag) return; view.ox += e.clientX - drag[0]; view.oy += e.clientY - drag[1]; drag = [e.clientX, e.clientY]; drawMap(); });
cv.addEventListener("pointerup", () => (drag = null));
cv.addEventListener("wheel", (e) => {
  e.preventDefault(); const r = cv.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top, k = Math.exp(-e.deltaY * 0.0015);
  view.ox = mx - (mx - view.ox) * k; view.oy = my - (my - view.oy) * k; view.s *= k; drawMap();
}, { passive: false });

// ---------- timeline ----------
const tl = $("timeline"), tx = tl.getContext("2d");
const TICK = { death: "--death", achievement: "--ach", level: "--level", quest: "--quest", chat: "--chat" };
function drawTimeline() {
  const r = tl.getBoundingClientRect(); tl.width = r.width * devicePixelRatio; tl.height = r.height * devicePixelRatio;
  tx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  const W = r.width, X = (ms) => (ms / D.duration) * W;
  tx.fillStyle = css("--line"); tx.fillRect(0, 26, W, 6);
  tx.fillStyle = css("--accent"); tx.fillRect(0, 26, X(t), 6);
  for (const e of D.events) {
    const c = TICK[e.ev]; if (!c) continue;
    tx.fillStyle = css(c); const h = e.ev === "chat" ? 6 : 14;
    tx.fillRect(Math.round(X(e.t)), 24 - h, e.ev === "chat" ? 1 : 2, h);
  }
  tx.fillStyle = css("--ink"); tx.beginPath(); tx.arc(X(t), 29, 6, 0, 7); tx.fill();
}
const seekFrom = (e) => { const r = tl.getBoundingClientRect(); setT(((e.clientX - r.left) / r.width) * D.duration); };
let seeking = false;
tl.addEventListener("pointerdown", (e) => { seeking = true; tl.setPointerCapture(e.pointerId); seekFrom(e); });
tl.addEventListener("pointermove", (e) => seeking && seekFrom(e));
tl.addEventListener("pointerup", () => (seeking = false));

// ---------- side panes ----------
const evIdx = (t) => { let lo = 0, hi = D.events.length; while (lo < hi) { const m = (lo + hi) >> 1; if (D.events[m].t <= t) lo = m + 1; else hi = m; } return lo; };
const who = (n) => `<span class="who" style="color:${color[n] ?? "inherit"}">${esc(n)}</span>`;
const unitName = (u) => (u ? (u.pl ? who(u.n) : esc(u.n) + (u.lvl ? ` <span class="muted">(${u.lvl})</span>` : "")) : "?");
function line(e) {
  switch (e.ev) {
    // server records name the speaker (n); client records are written by the listener, speaker in `from`
    case "chat": return `${who(e.from ?? e.n)} <span class="muted">[${CHAT[e.type] ?? e.type}${e.to ? " → " + esc(e.to) : ""}]</span> ${esc(e.msg)}`;
    case "death": return `${who(e.n)} was killed by ${unitName(e.killer)}`;
    case "kill": return `${who(e.n)} killed ${unitName(e.victim)}`;
    case "pvp": return `${who(e.n)} killed player ${unitName(e.victim)}`;
    case "achievement": return `${who(e.n)} earned <b>${esc(e.title)}</b> (${e.points} pts)`;
    case "level": return `${who(e.n)} reached level <b>${e.to}</b>`;
    case "quest": return `${who(e.n)} completed <b>${esc(e.title)}</b>`;
    case "loot": return `${who(e.n)} looted ${esc(D.items[e.item] ?? e.itemName ?? "item " + e.item)}${e.count > 1 ? " ×" + e.count : ""}`;
    case "zone": return `${who(e.n)} entered ${esc(D.zones[e.area] ?? D.zones[e.zone] ?? "zone " + e.zone)}`;
    case "release": return `${who(e.n)} released spirit`;
    case "resurrect": return `${who(e.n)} resurrected${e.sickness ? " (sickness)" : ""}`;
    case "login": return `${who(e.n)} logged in`;
    case "logout": return `${who(e.n)} logged out`;
    case "spell": return `${who(e.n)} learned spell ${e.id}`;
    case "dmg": return `${unitName(e.src)} hit ${unitName(e.dst)} for <b>${e.amount}</b>`;
    case "heal": return `${unitName(e.src)} healed ${unitName(e.dst)} for <b>${e.amount}</b>`;
    case "cast": return `${who(e.n)} cast ${esc(e.name)}${e.target ? " on " + unitName(e.target) : ""}`;
    case "xp": return `${who(e.n)} +${e.amount} xp`;
    case "api": { let p = {}; try { p = JSON.parse(e.params || "{}"); } catch {}
      return `${who(e.n)} <span class="muted">${esc(e.method)}</span> <code>${esc((p.code ?? JSON.stringify({ ...p, char: undefined })).slice(0, 160))}</code>`; }
    case "script_error": return `${who(e.n)} <span style="color:var(--death)">script error ×${e.count}</span> ${esc(e.last)}`;
    case "money": return `${who(e.n)} ${e.delta > 0 ? "+" : ""}${e.delta}c`;
    default: return `${who(e.n)} ${esc(e.ev)}`;
  }
}
const KINDS = { events: ["death", "kill", "pvp", "achievement", "level", "quest", "loot", "zone", "release", "resurrect", "login", "logout", "spell"],
  chat: ["chat"], combat: ["dmg", "heal", "cast", "kill", "death", "xp"], agent: ["api", "script_error"] };
let lastPane = "";
function renderPane() {
  let html = "";
  if (tab === "players") {
    for (const p of P) {
      const pp = at(p, t); if (!pp) { html += `<div class="card"><h3><span class="dot" style="background:${p.color}"></span>${esc(p.name)}</h3><div class="muted">not logged in yet</div></div>`; continue; }
      const r = pp.r, [pname, pvar] = POWER[r[7]] ?? ["power", "--mana"];
      const state = !r[11] ? (r[12] ? "ghost" : "dead") : r[13] ? "in combat" : "";
      html += `<div class="card"><h3><span class="dot" style="background:${p.color}"></span>${esc(p.name)} <span class="muted">${esc(p.cls)} · level ${r[8]}</span>${state ? ` <span style="color:var(--death)">${state}</span>` : ""}</h3>
        <div class="bar" title="health ${r[3]}/${r[4]}"><div style="width:${(100 * r[3]) / Math.max(1, r[4])}%;background:var(--hp)"></div></div>
        <div class="bar" title="${pname} ${r[5]}/${r[6]}"><div style="width:${(100 * r[5]) / Math.max(1, r[6])}%;background:var(${pvar})"></div></div>
        <div class="stats"><span>${r[3]}/${r[4]} hp</span><span>${r[9]} xp</span><span>${(r[10] / 100).toFixed(2)}s</span><span>${esc(D.zones[r[14]] ?? "")}</span></div>
        ${(() => { const s = scoreAt(p.name, t); return s ? `<div class="stats"><span><b>score ${s.score}</b></span><span>progress ${s.value}</span><span>pace ${s.pace}</span><span>${Math.round(s.recent_rate)}/h now</span></div>` : ""; })()}</div>`;
    }
  } else if (tab === "scores") {
    const rows = P.map((p) => ({ p, s: scoreAt(p.name, t) })).sort((a, b) => (b.s?.[metric] ?? -1e9) - (a.s?.[metric] ?? -1e9));
    html = `<label class="muted">Plot <select id="metric">${Object.entries(METRICS).map(([k, v]) => `<option value="${k}"${k === metric ? " selected" : ""}>${v}</option>`).join("")}</select></label>
      <canvas id="chart"></canvas>
      <table class="board">${rows.map(({ p, s }, i) => `<tr><td>${i + 1}</td><td><span class="dot" style="background:${p.color};display:inline-block"></span> ${who(p.name)} <span class="muted">${esc(p.cls)}</span></td>
        <td class="num">${s ? `L${s.level}` : ""}</td><td class="num"><b>${s ? s[metric] : "–"}</b></td></tr>`).join("")}</table>
      <p class="muted">score = (progress + pace) / 2; pace = average progress so far, so earlier gains count for more.</p>`;
  } else {
    const end = evIdx(t), kinds = KINDS[tab], rows = [];
    for (let i = end - 1; i >= 0 && rows.length < 200; i--) if (kinds.includes(D.events[i].ev)) rows.push(D.events[i]);
    html = rows.reverse().map((e) => `<div class="row" data-t="${e.t}"><span class="t">${fmt(e.t)}</span><span>${line(e)}</span></div>`).join("")
      || `<div class="muted">Nothing yet.</div>`;
  }
  if (html !== lastPane) {
    lastPane = html;
    const pane = $("pane"), atBottom = pane.scrollHeight - pane.scrollTop - pane.clientHeight < 40;
    pane.innerHTML = html;
    if (tab !== "players" && tab !== "scores" && atBottom) pane.scrollTop = pane.scrollHeight;
  }
  if (tab === "scores") drawChart();
}
// each player's chosen metric over the whole run, with the playhead
function drawChart() {
  const c = $("chart"); if (!c) return;
  const r = c.getBoundingClientRect(), g = c.getContext("2d");
  c.width = r.width * devicePixelRatio; c.height = r.height * devicePixelRatio; g.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  const L = 36, B = 18, W = r.width - L - 6, H = r.height - B - 6;
  const series = P.map((p) => ({ p, pts: scores(p.name).map((e) => [e.t, e[metric]]) }));
  const vals = series.flatMap((s) => s.pts.map((q) => q[1]));
  const lo = Math.min(0, ...vals), hi = Math.max(10, ...vals);
  const X = (ms) => L + (ms / Math.max(1, D.duration)) * W, Y = (v) => 6 + H - ((v - lo) / (hi - lo)) * H;
  g.font = "11px system-ui"; g.fillStyle = css("--quiet"); g.strokeStyle = css("--line"); g.lineWidth = 1;
  for (let k = 0; k <= 4; k++) { const v = lo + ((hi - lo) * k) / 4, y = Y(v); g.beginPath(); g.moveTo(L, y); g.lineTo(L + W, y); g.stroke(); g.textAlign = "right"; g.fillText(Math.round(v), L - 4, y + 4); }
  g.textAlign = "center"; for (let k = 0; k <= 4; k++) g.fillText(fmt((D.duration * k) / 4), X((D.duration * k) / 4), r.height - 4);
  for (const { p, pts } of series) {
    if (!pts.length) continue;
    g.beginPath(); pts.forEach(([ms, v], i) => (i ? g.lineTo(X(ms), Y(v)) : g.moveTo(X(ms), Y(v))));
    g.strokeStyle = p.color; g.lineWidth = follow === p.name ? 3 : 1.6; g.stroke();
  }
  g.strokeStyle = css("--ink"); g.lineWidth = 1; g.setLineDash([3, 3]); g.beginPath(); g.moveTo(X(t), 6); g.lineTo(X(t), 6 + H); g.stroke(); g.setLineDash([]);
}
$("pane").addEventListener("change", (e) => { if (e.target.id === "metric") { metric = e.target.value; lastPane = ""; renderPane(); } });
$("pane").addEventListener("click", (e) => { const r = e.target.closest(".row"); if (r) setT(Number(r.dataset.t)); });
document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => {
  tab = b.dataset.tab; document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-selected", x === b)); lastPane = ""; renderPane();
  try { localStorage.setItem("replay-tab", tab); } catch {}
}));
try { const saved = localStorage.getItem("replay-tab"); if (saved) document.querySelector(`.tabs [data-tab="${saved}"]`)?.click(); } catch {}

function renderChips() {
  $("chips").innerHTML = P.map((p) => `<button class="chip" aria-pressed="${follow === p.name}" data-n="${esc(p.name)}"><span class="dot" style="background:${p.color}"></span>${esc(p.name)} <span class="muted">${esc(p.cls)}</span></button>`).join("");
}
$("chips").addEventListener("click", (e) => { const c = e.target.closest(".chip"); if (!c) return; follow = follow === c.dataset.n ? null : c.dataset.n; if (follow) view.s = Math.max(view.s, 2.5); renderChips(); drawMap(); });

// ---------- playback ----------
let liveFollow = LIVE; // live mode keeps the playhead at the newest data until you seek back
function setT(v) { t = Math.max(0, Math.min(D.duration, v)); liveFollow = LIVE && t >= D.duration - 1500; render(); }
function render() {
  $("clock").textContent = `${fmt(t)} / ${fmt(D.duration)}`;
  if (LIVE) $("live").setAttribute("aria-pressed", liveFollow);
  drawMap(); drawTimeline(); renderPane();
}
$("play").addEventListener("click", () => { playing = !playing; $("play").textContent = playing ? "❚❚" : "▶"; $("play").setAttribute("aria-label", playing ? "Pause" : "Play"); if (playing && t >= D.duration) t = 0; last = performance.now(); });
$("speed").addEventListener("change", (e) => (speed = Number(e.target.value)));
addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT") return;
  if (e.code === "Space") { e.preventDefault(); $("play").click(); }
  if (e.code === "ArrowRight") setT(t + (e.shiftKey ? 60000 : 10000));
  if (e.code === "ArrowLeft") setT(t - (e.shiftKey ? 60000 : 10000));
});
let last = performance.now();
function frame(now) {
  if (liveFollow) { t = D.duration; render(); }
  else if (playing) { t += (now - last) * speed; if (t >= D.duration) { t = D.duration; playing = false; $("play").textContent = "▶"; liveFollow = LIVE; } render(); }
  last = now; requestAnimationFrame(frame);
}
addEventListener("resize", () => { fit(); render(); });
if (!LIVE) img.onload = () => { fit(); renderChips(); render(); requestAnimationFrame(frame); };
else {
  // live: recorder events arrive over server-sent events, absolute times; the replay clock starts at D.start
  const player = (n) => {
    let p = P.find((q) => q.name === n);
    if (!p) { p = { name: n, cls: "", color: PALETTE[P.length % PALETTE.length], track: [] }; P.push(p); color[n] = p.color; renderChips(); }
    return p;
  };
  let fitted = false;
  const es = new EventSource(`stream?since=${D.start}`);
  es.onmessage = (m) => {
    const e = JSON.parse(m.data), rel = e.t - D.start;
    if (D.chars.length && !D.chars.includes(e.n)) return;
    if (e.ev === "pos") {
      const p = player(e.n);
      p.track.push([rel, e.x, e.y, e.hp, e.hpmax, e.pw, e.pwmax, e.pt, e.lvl, e.xp, e.money, e.alive, e.ghost, e.combat, e.zone, e.m]);
      if (!fitted || (follow === e.n && e.m !== M.id)) { M.id = e.m; }
      if (!fitted) { fitted = true; fit(); }
    } else {
      if (e.ev === "login") { const p = player(e.n); p.cls = CLASSES[e.cls] ?? ""; renderChips(); }
      D.events.push({ ...e, t: rel });
      if (e.ev === "score") addScore(D.events.at(-1));
    }
    D.duration = Math.max(D.duration, rel);
  };
  setInterval(() => { D.duration = Math.max(D.duration, Date.now() - D.start); }, 1000);
  $("live").hidden = false;
  $("live").addEventListener("click", () => { liveFollow = true; playing = false; $("play").textContent = "▶"; render(); });
  fit(); renderChips(); render(); requestAnimationFrame(frame);
}
</script>
</body>
