page:
  title: Upper Blackrock Spire at level 60
  short: UBRS
  summary: >-
    Ten level-60 characters, every Alliance class but the death knight, start at Morgan's Vigil in pre-raid dungeon
    gear: two tanks, three healers and five damage dealers. The goal is to clear Upper Blackrock Spire and kill
    General Drakkisath. The clock is two hours.
  scoring: >-
    Whether the party earns the Upper Blackrock Spire achievement, then how long it takes. Each boss killed is a
