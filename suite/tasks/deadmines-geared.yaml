description: >
  A dungeon party at level 20: five Humans in Northshire (a tank, a healer, three DPS) with green gear, bags and the
  class spells trained (suite/kits), and one goal: clear the Deadmines (achievement 628, earned when Edwin VanCleef
  dies). Two hours on the clock; each agent stops when it has the achievement. Each boss is a checkpoint, so a run
  that doesn't finish shows how far it got.
goal: achievement:628
minutes: 120
checkpoints: # the Deadmines' bosses (creature entries), in the order they're usually met
  - {name: Rhahk'Zor, kill: 644}
  - {name: Sneed, kill: 643}
  - {name: Gilnid, kill: 1763}
  - {name: Mr. Smite, kill: 646}
  - {name: Cookie, kill: 645}
  - {name: Captain Greenskin, kill: 647}
  - {name: Edwin VanCleef, kill: 639}
require_fresh: true
party:
  - {class: warrior, spec: protwarrior, kit: protwarrior-20}
  - {class: priest, spec: holy, kit: holy-20}
  - {class: rogue, spec: combat, kit: combat-20}
  - {class: mage, spec: frost, kit: frost-20}
  - {class: paladin, spec: ret, kit: ret-20}
models: [haiku, sonnet, opus, opus-xhigh, luna, terra, sol, sol-xhigh, or-argon, or-argon-high, or-flash, or-flash-lite, or-deepseek, or-grok, or-mistral, or-muse]
page:
  title: The Deadmines at level 20
  short: Deadmines
  summary: >-
    Five level-20 characters start in Northshire with green gear and their class spells trained: a tank, a healer
    and three damage dealers. The goal is to clear the Deadmines and kill Edwin VanCleef. The clock is two hours.
  scoring: >-
    Whether the party earns the Deadmines achievement, then how long it takes. Each boss killed is a checkpoint, so
    an unfinished run shows how far it got.
  order: 4
