# Who plays: the models tasks list (suite/tasks), by key. Each is a runtime, its model and the reasoning effort,
# recorded with every run; to compare another effort, add another key (opus-high). Effort is required for claude
# and codex; opencode takes the provider's variant names, or none.

# Claude Code and Codex, each on its own provider
haiku: {runtime: claude, model: claude-haiku-5-5, effort: xhigh}
sonnet: {runtime: claude, model: claude-sonnet-5-5, effort: xhigh}
opus: {runtime: claude, model: claude-opus-5-5, effort: xhigh}
luna: {runtime: codex, model: gpt-6-luna, effort: xhigh}
terra: {runtime: codex, model: gpt-6.1-terra, effort: xhigh}
sol: {runtime: codex, model: gpt-6.1-sol, effort: xhigh}

# opencode through OpenRouter (OPENROUTER_API_KEY): one harness for every lab, so the model is all that differs
or-opus: {runtime: opencode, provider: openrouter, model: anthropic/claude-opus-5.5}
or-sonnet: {runtime: opencode, provider: openrouter, model: anthropic/claude-sonnet-5.5}
or-haiku: {runtime: opencode, provider: openrouter, model: anthropic/claude-haiku-5.5}
or-sol: {runtime: opencode, provider: openrouter, model: openai/gpt-6.1-sol}
or-terra: {runtime: opencode, provider: openrouter, model: openai/gpt-6.1-terra}
or-luna: {runtime: opencode, provider: openrouter, model: openai/gpt-6-luna}
or-argon: {runtime: opencode, provider: openrouter, model: google/gemini-4-argon}
or-flash: {runtime: opencode, provider: openrouter, model: google/gemini-3.8-flash}
or-flash-lite: {runtime: opencode, provider: openrouter, model: google/gemini-3.5-flash-lite}
or-deepseek: {runtime: opencode, provider: openrouter, model: deepseek/deepseek-v4-pro}

# cheap ones, for the smoke tests
or-haiku-4: {runtime: claude, provider: openrouter, model: anthropic/claude-haiku-4.5, effort: xhigh}
or-deepseek-flash: {runtime: opencode, provider: openrouter, model: deepseek/deepseek-v4-flash}
none: {runtime: none} # no agent: the sessions and judges only
