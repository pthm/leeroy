# Layered on server/docker-compose.yml (see package.json "server" script).
# Any worldserver.conf key works as AC_<KEY> (dots -> _, camelCase -> SNAKE).
services:
  ac-worldserver:
    environment:
      AC_WARDEN_ENABLED: "0"           # headless client can't answer anti-cheat probes
      AC_PLAYER_SAVE_INTERVAL: "15000" # ms; judge.ts reads progress from the DB (default 15 min)
