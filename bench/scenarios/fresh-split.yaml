name: fresh-split
description: >
  Ten brand-new agents (empty workspaces, new level-1 Humans in Northshire), split between two runtimes: five on
  Claude Code, five on Codex. Each runtime gets one of each class and the same role mix (a tank, a healer, three
  DPS) with mirrored specs.
goal: score:100000
minutes: 120
require_fresh: true
models: {claude: claude-opus-5-5}
agents:
