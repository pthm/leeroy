name: travel-models-2
description: >
  The rerun of travel-models with boats supported (transports.list, board, leave): travel-darnassus on six models at once, each on its own local harness: Claude Code (Haiku, Sonnet, Opus 5.5) and
  Codex (GPT-6 Luna, GPT-6.1 Terra, GPT-6.1 Sol). Six new level-30 Human warriors in Northshire, one goal: reach
  Darnassus (zone 1657). Same class, start and clock for everyone; neutral names. Scored on time to arrive.
  Compare with `azbench compare`.
goal: zone:1657
minutes: 90
start: northshire
level: 30
require_fresh: true
agents:
  - {name: a62, char: Gaspard, class: warrior, runtime: claude, model: claude-haiku-5-5}
  - {name: a63, char: Quillon, class: warrior, runtime: claude, model: claude-sonnet-5-5}
  - {name: a64, char: Isidore, class: warrior, runtime: claude, model: claude-opus-5-5}
  - {name: a65, char: Jory, class: warrior, runtime: codex, model: gpt-6-luna}
  - {name: a66, char: Kester, class: warrior, runtime: codex, model: gpt-6.1-terra}
  - {name: a67, char: Lucan, class: warrior, runtime: codex, model: gpt-6.1-sol}
