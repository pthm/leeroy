name: travel-models
description: >
  travel-darnassus on six models at once, each on its own local harness: Claude Code (Haiku, Sonnet, Opus 5.5) and
  Codex (GPT-6 Luna, GPT-6.1 Terra, GPT-6.1 Sol). Six new level-30 Human warriors in Northshire, one goal: reach
  Darnassus (zone 1657). Same class, start and clock for everyone; neutral names. Scored on time to arrive.
  Compare with `azbench compare`.
goal: zone:1657
minutes: 90
start: northshire
level: 30
require_fresh: true
effort: xhigh # reasoning effort, recorded with the run (required for claude and codex)
agents:
  - {name: a56, char: Aubrin, class: warrior, runtime: claude, model: claude-haiku-5-5}
  - {name: a57, char: Bertil, class: warrior, runtime: claude, model: claude-sonnet-5-5}
  - {name: a58, char: Cosimo, class: warrior, runtime: claude, model: claude-opus-5-5}
  - {name: a59, char: Dorian, class: warrior, runtime: codex, model: gpt-6-luna}
  - {name: a60, char: Evander, class: warrior, runtime: codex, model: gpt-6.1-terra}
  - {name: a61, char: Faramund, class: warrior, runtime: codex, model: gpt-6.1-sol}
